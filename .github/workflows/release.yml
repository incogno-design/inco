name: Release inco → main

on:
  push:
    branches: [inco]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inco branch
        uses: actions/checkout@v4
        with:
          ref: inco

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install inco
        run: go install github.com/imnive-design/inco-go/cmd/inco@latest

      - name: Smoke test — self-bootstrap
        run: |
          # Use installed inco to gen + build itself
          inco gen .
          inco build -o /tmp/inco-verified ./cmd/inco

          # Clean up overlay so release starts fresh
          rm -rf .inco_cache
          echo "incogno design: self-bootstrap smoke test passed"

      - name: Release
        run: |
          # Generate overlay and release .inco.go → .go (with guards)
          inco release .

          # Rename remaining .inco.go files (those without directives) → .go
          find . -name '*.inco.go' -not -path './.inco_cache/*' | while read -r f; do
            target="${f%.inco.go}.go"
            mv "$f" "$target"
            echo "  renamed: $f → $target"
          done

          # Clean up cache and dev-only files
          rm -rf .inco_cache

      - name: Verify released code compiles
        run: |
          go build ./...
          echo "release: build verification passed"

      - name: Verify released tests pass
        run: |
          go test ./...
          echo "release: test verification passed"

      - name: Push to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: inco@${GITHUB_SHA::7}" --allow-empty
          git push origin HEAD:main --force
