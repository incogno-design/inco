name: Release to inco-go

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'imnive-design/inco'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install inco
        run: go install github.com/imnive-design/inco-go/cmd/inco@latest

      - name: Release
        run: |
          # Generate overlay and release .inco.go → .go (with guards)
          inco release .

          # Rename remaining .inco.go files (those without directives) → .go
          find . -name '*.inco.go' -not -path './.inco_cache/*' | while read -r f; do
            target="${f%.inco.go}.go"
            mv "$f" "$target"
            echo "  renamed: $f → $target"
          done

          # Clean up cache and dev-only files
          rm -rf .inco_cache

      - name: Verify released code compiles
        run: |
          go build ./...
          echo "inco-go: build verification passed"

      - name: Verify released tests pass
        run: |
          go test ./...
          echo "inco-go: test verification passed"

      - name: Smoke test — self-bootstrap
        run: |
          # Build an inco binary from the released (plain Go) code
          go build -o /tmp/inco-smoke ./cmd/inco

          # Use the binary to gen + build itself — the strictest self-hosting check
          /tmp/inco-smoke gen .
          /tmp/inco-smoke build -o /tmp/inco-smoke2 ./cmd/inco
          echo "inco-go: self-bootstrap smoke test passed"

      - name: Push to inco-go
        env:
          INCO_GO_TOKEN: ${{ secrets.INCO_GO_TOKEN }}
        run: |
          git clone "https://x-access-token:${INCO_GO_TOKEN}@github.com/imnive-design/inco-go.git" /tmp/inco-go

          # Sync everything except .git and .github
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            ./ /tmp/inco-go/

          cd /tmp/inco-go
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "inco-go: no changes to push"
          else
            git commit -m "release: imnive-design/inco@${GITHUB_SHA::7}"
            git push
            echo "inco-go: pushed release"
          fi
