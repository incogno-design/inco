name: Test

on:
  push:
    branches: [inco]
  pull_request:
    branches: [inco]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install inco (stable)
        run: go install github.com/incogno-design/inco/cmd/inco@latest

      - name: Self-bootstrap — gen + build
        run: |
          inco gen .
          inco build ./...

      - name: Run tests
        run: inco test ./...
