name: Test

on:
  push:
    branches: [inco]
  pull_request:
    branches: [inco]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install inco (stable bootstrap)
        run: go install github.com/incogno-design/inco/cmd/inco@latest

      - name: Self-host — gen + build current inco
        run: |
          inco gen .
          go build -overlay .inco_cache/overlay.json -o "${{ runner.temp }}/inco" ./cmd/inco

      - name: Check directives (gate)
        run: |
          "${{ runner.temp }}/inco" check .

      - name: Run tests
        run: inco test ./...
